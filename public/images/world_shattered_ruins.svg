<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <linearGradient id="ruinsSky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#050510"/><stop offset="50%" stop-color="#1a0508"/>
      <stop offset="80%" stop-color="#2a0508"/><stop offset="100%" stop-color="#3a0a10"/>
    </linearGradient>
    <radialGradient id="crystalGlow" cx="0.5" cy="0.3" r="0.4">
      <stop offset="0%" stop-color="#cc2244" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#cc2244" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="800" height="600" fill="url(#ruinsSky)"/>
  <rect width="800" height="600" fill="url(#crystalGlow)"/>
  <!-- Storm clouds -->
  <g fill="#0a0a12" opacity="0.5">
    <ellipse cx="200" cy="80" rx="120" ry="40"/>
    <ellipse cx="400" cy="60" rx="150" ry="50"/>
    <ellipse cx="600" cy="90" rx="130" ry="45"/>
    <ellipse cx="300" cy="100" rx="100" ry="35"/>
    <ellipse cx="500" cy="120" rx="140" ry="40"/>
  </g>
  <!-- Broken statues -->
  <g fill="#151515">
    <rect x="150" y="300" width="30" height="80"/>
    <circle cx="165" cy="290" r="15"/>
    <rect x="145" y="310" width="40" height="8"/>
    <rect x="155" y="380" width="20" height="40"/>
  </g>
  <g fill="#1a1a1a">
    <rect x="500" y="320" width="25" height="70"/>
    <circle cx="512" cy="310" r="12"/>
    <rect x="495" y="330" width="35" height="6"/>
  </g>
  <!-- Collapsed temple -->
  <g fill="#101015">
    <polygon points="300,250 400,200 500,250 500,400 300,400"/>
    <polygon points="320,260 400,220 480,260"/>
    <rect x="350" y="280" width="100" height="120"/>
    <rect x="360" y="290" width="80" height="8" transform="rotate(15, 400, 294)"/>
  </g>
  <!-- Ruined gateway -->
  <g fill="#0d0d12">
    <rect x="280" y="220" width="20" height="180"/>
    <rect x="500" y="240" width="20" height="160"/>
    <rect x="280" y="220" width="240" height="15"/>
  </g>
  <!-- Floating debris -->
  <g fill="#1a1a1a" opacity="0.6">
    <rect x="350" y="170" width="25" height="8" transform="rotate(-20, 362, 174)"/>
    <rect x="450" y="190" width="20" height="6" transform="rotate(15, 460, 193)"/>
    <rect x="320" y="200" width="15" height="5" transform="rotate(-10, 327, 202)"/>
  </g>
  <!-- Floating crystals -->
  <g>
    <polygon points="400,150 410,130 420,150 410,170" fill="#cc2244" opacity="0.4"/>
    <polygon points="350,180 358,165 366,180 358,195" fill="#cc2244" opacity="0.3"/>
    <polygon points="480,160 486,148 492,160 486,172" fill="#cc2244" opacity="0.35"/>
  </g>
  <!-- Ground -->
  <rect x="0" y="450" width="800" height="150" fill="#080808"/>
  <!-- Vignette -->
  <rect x="0" y="500" width="800" height="100" fill="#050508" opacity="0.4"/>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <linearGradient id="deepSky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#020510"/><stop offset="30%" stop-color="#050a18"/>
      <stop offset="60%" stop-color="#0a0a20"/><stop offset="100%" stop-color="#0a1525"/>
    </linearGradient>
    <radialGradient id="bioGlow1" cx="0.3" cy="0.4" r="0.3">
      <stop offset="0%" stop-color="#00ffaa" stop-opacity="0.1"/><stop offset="100%" stop-color="#00ffaa" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="bioGlow2" cx="0.7" cy="0.5" r="0.25">
      <stop offset="0%" stop-color="#0088ff" stop-opacity="0.08"/><stop offset="100%" stop-color="#0088ff" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="800" height="600" fill="url(#deepSky)"/>
  <rect width="800" height="600" fill="url(#bioGlow1)"/>
  <rect width="800" height="600" fill="url(#bioGlow2)"/>
  <!-- Ocean surface hint -->
  <path d="M0 0 Q100 10 200 5 Q300 15 400 8 Q500 12 600 6 Q700 14 800 10 L800 0Z" fill="#0a1525" opacity="0.5"/>
  <!-- Submerged ruins -->
  <g fill="#0a0a15" opacity="0.6">
    <rect x="200" y="250" width="15" height="100"/>
    <rect x="300" y="280" width="12" height="70"/>
    <rect x="500" y="260" width="18" height="90"/>
    <rect x="550" y="300" width="10" height="50"/>
  </g>
  <g fill="#0a0a18" opacity="0.5">
    <rect x="200" y="240" width="100" height="8"/>
    <rect x="200" y="340" width="100" height="6"/>
    <rect x="280" y="250" width="15" height="80"/>
  </g>
  <!-- Dome structure -->
  <path d="M350 350 Q400 280 450 350Z" fill="#0a0a18" opacity="0.4" stroke="#0a1525" stroke-width="2"/>
  <!-- Bioluminescent dots -->
  <g opacity="0.5">
    <circle cx="250" cy="400" r="2" fill="#00ffaa"/><circle cx="280" cy="420" r="1.5" fill="#00ffaa"/>
    <circle cx="350" cy="380" r="1.5" fill="#00ffaa"/><circle cx="450" cy="430" r="2" fill="#00ffaa"/>
    <circle cx="520" cy="390" r="1.5" fill="#0088ff"/><circle cx="560" cy="410" r="1" fill="#0088ff"/>
    <circle cx="600" cy="380" r="1.5" fill="#0088ff"/><circle cx="400" cy="440" r="1" fill="#00ffaa"/>
    <circle cx="300" cy="350" r="1" fill="#00ffcc"/><circle cx="500" cy="360" r="1.2" fill="#00ffcc"/>
  </g>
  <!-- Bioluminescent streaks -->
  <g opacity="0.3">
    <path d="M200 450 Q250 440 300 445" stroke="#00ffaa" stroke-width="1" fill="none"/>
    <path d="M450 420 Q500 415 550 425" stroke="#0088ff" stroke-width="1" fill="none"/>
    <path d="M500 370 Q530 365 560 370" stroke="#0088ff" stroke-width="0.8" fill="none"/>
  </g>
  <!-- Seaweed -->
  <g stroke="#0a1a15" stroke-width="2" fill="none" opacity="0.4">
    <path d="M150 500 Q155 460 160 470 Q165 440 170 460"/>
    <path d="M600 500 Q605 470 610 480 Q615 450 620 465"/>
  </g>
  <!-- Deep ocean gradient -->
  <rect x="0" y="480" width="800" height="120" fill="#020510" opacity="0.5"/>
</svg>

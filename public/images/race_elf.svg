<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400">
  <defs>
    <linearGradient id="elfBg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#050a10"/><stop offset="40%" stop-color="#0a1520"/>
      <stop offset="100%" stop-color="#0a2a15"/>
    </linearGradient>
    <radialGradient id="worldTreeGlow" cx="0.5" cy="0.3" r="0.4">
      <stop offset="0%" stop-color="#d4af37" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#d4af37" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="600" height="400" fill="url(#elfBg)"/>
  <rect width="600" height="400" fill="url(#worldTreeGlow)"/>
  <!-- World Tree -->
  <g fill="#051008" opacity="0.8">
    <rect x="280" y="80" width="40" height="200"/>
    <ellipse cx="300" cy="80" rx="120" ry="60"/>
    <ellipse cx="220" cy="120" rx="60" ry="30"/>
    <ellipse cx="380" cy="110" rx="50" ry="25"/>
    <ellipse cx="300" cy="50" rx="80" ry="35"/>
  </g>
  <!-- Branches -->
  <g stroke="#051008" stroke-width="4" fill="none" opacity="0.7">
    <path d="M290 150 Q200 130 150 160"/>
    <path d="M310 140 Q400 120 450 140"/>
    <path d="M295 100 Q230 70 180 80"/>
    <path d="M305 90 Q370 60 420 70"/>
  </g>
  <!-- Queen figure -->
  <g fill="#050a08" opacity="0.7">
    <ellipse cx="250" cy="270" rx="5" ry="12"/>
    <circle cx="250" cy="258" r="5"/>
    <!-- Dress trail -->
    <path d="M245 278 Q240 290 235 300"/>
  </g>
  <!-- Forest floor -->
  <rect x="0" y="330" width="600" height="70" fill="#050a08"/>
  <!-- Light rays through canopy -->
  <g opacity="0.04">
    <polygon points="300,0 250,400 280,400" fill="#d4af37"/>
    <polygon points="300,0 320,400 350,400" fill="#d4af37"/>
  </g>
</svg>

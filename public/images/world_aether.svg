<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <linearGradient id="aetherSky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0a0a2a"/><stop offset="40%" stop-color="#1a1a4a"/>
      <stop offset="70%" stop-color="#2a1a0a"/><stop offset="100%" stop-color="#d4af37"/>
    </linearGradient>
    <linearGradient id="aetherFog" x1="0" y1="0.6" x2="0" y2="1">
      <stop offset="0%" stop-color="#d4af37" stop-opacity="0"/><stop offset="100%" stop-color="#d4af37" stop-opacity="0.12"/>
    </linearGradient>
  </defs>
  <rect width="800" height="600" fill="url(#aetherSky)"/>
  <!-- Distant mountains -->
  <path d="M0 400 Q100 300 200 350 Q300 280 400 320 Q500 260 600 310 Q700 270 800 340 L800 450 L0 450Z" fill="#151530" opacity="0.6"/>
  <!-- City -->
  <g fill="#0a0a15" opacity="0.85">
    <rect x="250" y="300" width="15" height="60"/><rect x="270" y="285" width="12" height="75"/>
    <rect x="287" y="295" width="18" height="65"/><rect x="310" y="275" width="10" height="85"/>
    <rect x="325" y="290" width="14" height="70"/><rect x="344" y="270" width="8" height="90"/>
    <rect x="358" y="285" width="16" height="75"/><rect x="380" y="295" width="11" height="65"/>
    <rect x="396" y="280" width="13" height="80"/><rect x="415" y="300" width="17" height="60"/>
  </g>
  <!-- Cathedral -->
  <g fill="#0a0a15" opacity="0.95">
    <polygon points="340,260 352,220 364,260"/>
    <rect x="336" y="215" width="32" height="6"/>
    <polygon points="360,255 370,230 380,255"/>
    <rect x="357" y="225" width="26" height="5"/>
  </g>
  <!-- Golden glow behind city -->
  <ellipse cx="350" cy="400" rx="150" ry="40" fill="#d4af37" opacity="0.06"/>
  <rect x="0" y="380" width="800" height="80" fill="url(#aetherFog)"/>
  <!-- Markets -->
  <g fill="#0d0d18" opacity="0.7">
    <rect x="220" y="360" width="200" height="4"/>
    <rect x="230" y="360" width="3" height="20"/><rect x="250" y="360" width="3" height="15"/>
    <rect x="280" y="360" width="3" height="18"/><rect x="310" y="360" width="3" height="12"/>
    <rect x="340" y="360" width="3" height="16"/><rect x="370" y="360" width="3" height="14"/>
  </g>
  <!-- Ground -->
  <rect x="0" y="450" width="800" height="150" fill="#0a0a10"/>
  <!-- Fog -->
  <rect x="0" y="420" width="800" height="180" fill="#050508" opacity="0.3"/>
</svg>

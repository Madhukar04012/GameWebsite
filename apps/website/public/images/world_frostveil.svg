<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <linearGradient id="frostSky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0a0a15"/><stop offset="40%" stop-color="#0a1520"/>
      <stop offset="70%" stop-color="#0a2030"/><stop offset="100%" stop-color="#1a2a3a"/>
    </linearGradient>
    <linearGradient id="aurora" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#00ff88" stop-opacity="0"/><stop offset="0.3" stop-color="#00ff88" stop-opacity="0.08"/>
      <stop offset="0.5" stop-color="#00ccff" stop-opacity="0.12"/><stop offset="0.7" stop-color="#8800ff" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#00ff88" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <rect width="800" height="600" fill="url(#frostSky)"/>
  <rect width="800" height="200" fill="url(#aurora)"/>
  <!-- Stars -->
  <g fill="#ffffff" opacity="0.5">
    <circle cx="100" cy="50" r="1"/><circle cx="250" cy="30" r="1.5"/><circle cx="400" cy="80" r="1"/>
    <circle cx="550" cy="40" r="1.2"/><circle cx="700" cy="60" r="0.8"/><circle cx="150" cy="120" r="0.8"/>
    <circle cx="650" cy="100" r="1"/><circle cx="350" cy="150" r="0.6"/>
  </g>
  <!-- Distant mountains -->
  <path d="M0 400 Q80 300 180 340 Q280 260 380 310 Q480 250 580 290 Q680 240 800 320 L800 450 L0 450Z" fill="#0a1520" opacity="0.7"/>
  <path d="M0 430 Q100 350 200 380 Q300 330 400 360 Q500 310 600 350 Q700 320 800 380 L800 480 L0 480Z" fill="#0a1a25" opacity="0.6"/>
  <!-- Frozen castle -->
  <g fill="#0a1520" opacity="0.8">
    <rect x="320" y="320" width="12" height="40"/><rect x="338" y="310" width="10" height="50"/>
    <rect x="352" y="325" width="14" height="35"/><rect x="370" y="305" width="8" height="55"/>
    <rect x="382" y="315" width="12" height="45"/><rect x="398" y="330" width="10" height="30"/>
    <rect x="415" y="320" width="15" height="40"/>
  </g>
  <g fill="#0a1a25" opacity="0.7">
    <rect x="310" y="360" width="130" height="8"/>
    <rect x="300" y="368" width="150" height="6"/>
  </g>
  <!-- Snow-covered ground -->
  <path d="M0 450 Q100 430 200 445 Q300 425 400 440 Q500 420 600 435 Q700 425 800 445 L800 600 L0 600Z" fill="#0a1520"/>
  <path d="M0 460 Q100 445 200 458 Q300 440 400 455 Q500 435 600 450 Q700 440 800 458 L800 600 L0 600Z" fill="#0d1a25"/>
  <!-- Tiny caravan -->
  <g fill="#152030" opacity="0.7">
    <rect x="200" y="430" width="8" height="4"/><rect x="210" y="432" width="6" height="3"/>
    <rect x="218" y="430" width="8" height="4"/><rect x="228" y="433" width="5" height="2"/>
    <circle cx="215" cy="445" r="2"/><circle cx="225" cy="445" r="2"/>
  </g>
  <!-- Frozen river -->
  <path d="M350 450 Q400 460 450 455 Q500 465 550 460" stroke="#1a3050" stroke-width="4" fill="none" opacity="0.3"/>
  <!-- Snow fog -->
  <rect x="0" y="380" width="800" height="220" fill="#0a1520" opacity="0.2"/>
</svg>

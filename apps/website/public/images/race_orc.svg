<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400">
  <defs>
    <linearGradient id="orcBg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0a0505"/><stop offset="40%" stop-color="#1a0a05"/>
      <stop offset="70%" stop-color="#2a0a05"/><stop offset="100%" stop-color="#1a0505"/>
    </linearGradient>
    <radialGradient id="firelight" cx="0.5" cy="0.7" r="0.35">
      <stop offset="0%" stop-color="#ff4400" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#ff4400" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="600" height="400" fill="url(#orcBg)"/>
  <rect width="600" height="400" fill="url(#firelight)"/>
  <!-- Storm clouds -->
  <g fill="#0a0505" opacity="0.5">
    <ellipse cx="150" cy="60" rx="120" ry="40"/>
    <ellipse cx="400" cy="40" rx="140" ry="45"/>
    <ellipse cx="300" cy="80" rx="100" ry="30"/>
  </g>
  <!-- War camp tents -->
  <g fill="#0a0a0f" opacity="0.7">
    <polygon points="100,300 130,240 160,300"/>
    <polygon points="140,310 175,245 210,310"/>
    <polygon points="380,290 420,230 460,290"/>
    <polygon points="430,300 460,245 490,300"/>
  </g>
  <!-- Banners -->
  <g fill="#0d0d15" opacity="0.6">
    <rect x="145" y="250" width="1.5" height="50"/>
    <rect x="146" y="250" width="10" height="7"/>
    <rect x="425" y="235" width="1.5" height="55"/>
    <rect x="426" y="235" width="10" height="7"/>
  </g>
  <!-- Smoke -->
  <g filter="url(#blur2)">
    <ellipse cx="200" cy="150" rx="40" ry="20" fill="#0a0505" opacity="0.3"/>
    <ellipse cx="350" cy="120" rx="35" ry="18" fill="#0a0505" opacity="0.25"/>
  </g>
  <!-- Orc figure walking -->
  <g fill="#050508" opacity="0.8">
    <rect x="300" y="290" width="12" height="25"/>
    <circle cx="306" cy="284" r="8"/>
    <rect x="295" y="295" width="4" height="15"/>
    <rect x="313" y="296" width="4" height="14"/>
    <!-- Weapon -->
    <rect x="320" y="270" width="3" height="30"/>
    <rect x="318" y="270" width="7" height="4"/>
  </g>
  <!-- Ground -->
  <rect x="0" y="340" width="600" height="60" fill="#050508"/>
</svg>
